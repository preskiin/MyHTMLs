 <style>
    body{
  background-color: red;
  position: relative;
  overflow: hidden;
  margin:0;
}
#fx-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  background: transparent;
  pointer-events: none; 
}
body::before {
  content: '';
  position: fixed;
  top:-100%;
  width: 100%;
  height:200%;
  background: repeating-linear-gradient(in oklch, #0054d3, #00725f, #0054d3, #00725f,#0054d3);
  animation: waterfall-bg 20s linear infinite;
  z-index: -2;              /*чтобы контент был поверх */
}
@keyframes waterfall-bg {
  from { transform: translate(0%, 0%); }
  to   { transform: translate(0%, 50%); }
}
.menu {
  display: grid;
  grid-template-columns: repeat(auto-fill, 200px);
  gap:20px;
  min-width: fit-content;
  min-height: 168px;
  list-style: none; /**/
  border: solid 2px rgba(255, 255, 255, 0.3); 
  border-radius: 30px;
  margin: 40px;
  padding: 20px;
  background-color: rgba(56, 153, 177, 0.3);
}
.menu a {
  text-decoration:none;
}
.menu a li {
  text-align: center;
  margin: 5px;
  border:solid 2px #ffffffb3;
  border-radius:10px;
  background-color: rgb(0, 98, 143);
  transition: transform 0.5s ease;
}
.menu a li img {
  vertical-align: middle;
  width:160px;
  height:160px;
  border-radius: 5px;
  filter:blur(5px);
  transition: filter 1s ease;
  margin:4px;
  object-fit: cover;
  
}
.menu a li div {
  color:rgb(190, 255, 246);
  font-family: Trebuchet MS;
  z-index:1;
  transform: translateY(0px);
  transition: transform 1s ease;
}
.menu a li:hover img{
  filter:blur(0px) brightness(1.1);
  transition: filter 1s ease;
}
.menu a li:hover div{
  transform: translateY(-20px) scale(1.5);
  transition: transform 1s ease, filter 1s ease;
}
.menu a li:hover {
  transform: scale(1.02);
  box-shadow: 0 0 2px rgba(255,255,255,1);
}
 </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = document.body.clientWidth;
  canvas.height = document.body.clientHeight;
  function resize() {
    canvas.width = document.body.clientWidth;
    canvas.height = document.body.clientHeight;
  }
  window.addEventListener('resize', resize);

  let particles=[];
  canvas.addEventListener('click', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX-rect.left;
    const cy = e.clientY-rect.top;
    for (let i=0;i<5;i++){
        let angle = Math.random() * Math.PI*2;
        let speed = Math.random()*4 +2;
        particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            size: Math.random()*3 +2
        });
    }
  });
    
  function animate(){
    ctx.fillStyle = 'rgba(0,0,0,0)'; //0.1 эффект затухания
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (i=0;i<particles.length;i++){
        let particle = particles[i];
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.life-=0.001;
        if (particle.life<=0) {
            particles.splice(0,i);
            continue;
        }
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,200,50, ${particle.life})`;
        ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
