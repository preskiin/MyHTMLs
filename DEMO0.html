<head>
<meta charset="UTF-8">
<!--<link rel="stylesheet" href="styles.css">-->
<style>
    body{
  background-color: red;
  position: relative;
  overflow: hidden;
  margin:0;
}
#fx-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  background: transparent;
  pointer-events: none; 
}
body::before {
  content: '';
  position: fixed;
  top:-100%;
  width: 100%;
  height:200%;
  background: repeating-linear-gradient(in oklch, #0054d3, #00725f, #0054d3, #00725f,#0054d3);
  animation: waterfall-bg 20s linear infinite;
  z-index: -2;              /*чтобы контент был поверх */
}
@keyframes waterfall-bg {
  from { transform: translate(0%, 0%); }
  to   { transform: translate(0%, 50%); }
}
.menu {
  display: grid;
  grid-template-columns: repeat(auto-fill, 200px);
  gap:20px;
  min-width: fit-content;
  min-height: 168px;
  list-style: none; /**/
  border: solid 2px rgba(255, 255, 255, 0.3); 
  border-radius: 30px;
  margin: 40px;
  padding: 20px;
  background-color: rgba(56, 153, 177, 0.3);
}
.menu a {
  text-decoration:none;
}
.menu a li {
  text-align: center;
  margin: 5px;
  border:solid 2px #ffffffb3;
  border-radius:10px;
  background-color: rgb(0, 98, 143);
  transition: transform 0.5s ease;
}
.menu a li img {
  vertical-align: middle;
  width:160px;
  height:160px;
  border-radius: 5px;
  filter:blur(5px);
  transition: filter 1s ease;
  margin:4px;
  object-fit: cover;
  
}
.menu a li div {
  color:rgb(190, 255, 246);
  font-family: Trebuchet MS;
  z-index:1;
  transform: translateY(0px);
  transition: transform 1s ease;
}
.menu a li:hover img{
  filter:blur(0px) brightness(1.1);
  transition: filter 1s ease;
}
.menu a li:hover div{
  transform: translateY(-20px) scale(1.5);
  transition: transform 1s ease, filter 1s ease;
}
.menu a li:hover {
  transform: scale(1.02);
  box-shadow: 0 0 2px rgba(255,255,255,1);
}
</style>
</head>
<body>
  <canvas id="fx-canvas"></canvas>
  <nav aria-label="Main menu">
    <ul class="menu">
      <a href="1.html">
        <li>
            <img src="resources/1.png">
            <div>First</div>
        </li>
      </a>
      <a href="2.html">
        <li>
          <img src="resources/2.png">
          <div>Second</div>
        </li>
      </a>
      <a href="3.html">
        <li>
          <img src="resources/3.png">
          <div>Third</div>
        </li>
      </a>
    </ul>
  </nav>
  <script>
    let particles=[];
    let isAnimating=false;
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // функция изменения размера окна
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    document.addEventListener('click', (e) => {
      createExplosion(e.clientX, e.clientY);
      startAnimation();
    });
    // функция инциализации всех частиц взрыва (координаты центра, скорость, время жизни, размер и цвет)
    function createExplosion(fx, fy){
      let count=70;
      for (let i=0;i<count;i++){
        let angle = Math.random() * Math.PI*2; //определяем направление движения
        let speed = Math.random()*4 +2; // определяем скорость
        particles.push({
          x: fx,
          y: fy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0, // время жизни частицы, требуется для затухания и удаления частицы с экрана с течением времени
          size: Math.random()*3 +2,
          color: `hsl(${Math.random() * 60 + 20}, 100%, 60%)` // задан через hsl, соответсвует выборке определных цветов. Нужно разобраться
        });
      }
    }
    // главная функция отрисовки. Вызывается рекурсивно
    function animate(){
      ctx.clearRect(0, 0, canvas.width, canvas.height); //очищаем холст, чтобы не оставлять следы после прошлой позиции частицы
      let particle;
      for (i=particles.length-1;i>=0;i--){  //описание действия для КАЖДОЙ частицы при вызове функции
        particle = particles[i];
        particle.x += particle.vx; // сдвиг по OX
        particle.y += particle.vy; // сдвиг по OY
        particle.life-=0.001; // влияние времени на время существования частицы 
        if (particle.life<=0) {
            particles.splice(i,1);
            continue;
        }
        ctx.globalAlpha = particle.life;  // благодаря globalAlpha выставляется прозрачность кисти (увеличиваем прозрачность частицы при удалении от центра)
        ctx.beginPath(); // отдает кисти команду о начале НОВОГО пути. Если убрать beginPath(), переход от одной точки к другой (от одной частицы к следующей) будет соединен
        ctx.arc(particle.x, particle.y, particle.size*particle.life, 0, Math.PI*2); //изображение круга (а точнее - дуги, координаты центра, радиус начала и радиус конца отрисовки)
        ctx.fillStyle= particle.color; //цвет заполнения
        ctx.fill(); // команда кисти заполнить цветом нарисованную фигуру
      }
      ctx.globalAlpha = 1; // сбрасываем прозрачность кисти для корректного изображения следующей частицы
      if (particles.length>0){
        requestAnimationFrame(animate);
      } else {
        isAnimating=false;
      }
    }
    function startAnimation(){
      if (!isAnimating) {
        isAnimating=true;
        animate();
      }
    }
  </script>
</body>
